services:
  - type: web
    name: dostipendii-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/v1/health
    
  - type: static
    name: dostipendii-frontend
    region: frankfurt
    buildCommand: ""
    staticPublishPath: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
